name: eledrone desktop

# Builds the desktop app for Windows and Linux, and publishes a GitHub Release
# when a v* tag is pushed.
#
#   push to develop -> builds both platforms, artifacts kept 14 days
#   push to main    -> builds both platforms AND publishes a GitHub Release
#   manual dispatch -> builds both platforms
#
# The released version comes from apps/desktop/package.json, and the release is
# tagged "eledrone-v<version>". Bump that version before merging into main; if a
# release for it already exists the release step stops rather than duplicating.
#
# The tag is prefixed rather than a bare "v" because this fork inherits every
# upstream element-web tag (~670) and syncing upstream pushes more, which would
# otherwise collide with our versions.
#
# Deliberately independent of Element's own workflows: no code signing, no
# packages.element.io, no Netlify/Localazy, no secrets at all.
#
# Two things this does differently from the inherited element workflows:
#   * The web app is built here and packed into webapp.asar. `pnpm run fetch`
#     downloads upstream element-web's prebuilt tarball, which would ship
#     Element's branding instead of ours.
#   * Native modules (matrix-seshat) are not built, so local event search is
#     unavailable. Building them needs Rust plus SQLCipher on both platforms.

on:
    push:
        branches: [develop, main]
        # A push that only touches documentation cannot change the installers, so
        # skip a ~20 minute two-platform build. A push containing both docs and
        # code still builds: the skip applies only when *every* changed file
        # matches. Use workflow_dispatch if you need a build anyway.
        paths-ignore:
            - "**.md"
            - "docs/**"
    workflow_dispatch:

concurrency:
    group: eledrone-desktop-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: write # needed to create the Release

jobs:
    build:
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: windows-latest
                      platform: windows
                    - os: ubuntu-latest
                      platform: linux
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v4

            # Long, deeply nested paths under packages/shared-components/__vis__
            # exceed the Windows 260 character limit without this.
            - name: Allow long paths (Windows)
              if: runner.os == 'Windows'
              run: git config --global core.longpaths true

            # apps/web's prebuild step shells out to `sh`, which is not on PATH for
            # child processes on the Windows runner unless Git's bin directory is.
            - name: Put sh on PATH (Windows)
              if: runner.os == 'Windows'
              run: echo "C:\Program Files\Git\bin" >> $env:GITHUB_PATH

            - run: corepack enable

            - uses: actions/setup-node@v4
              with:
                  node-version-file: .node-version
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # fpm builds the Arch package's .MTREE by shelling out to bsdtar, which
            # is not on the Ubuntu runner. Without it fpm dies with exit 127 and the
            # whole build fails - the deb and tar.gz never get written either.
            - name: Install bsdtar, for the Arch package (Linux)
              if: runner.os == 'Linux'
              run: sudo apt-get update && sudo apt-get install -y libarchive-tools

            - name: Version
              id: version
              shell: bash
              run: |
                  # One source of truth for the version, so a develop artifact and the
                  # release built from the same commit carry the same number. Must stay
                  # plain semver: a prerelease suffix breaks MSI generation.
                  version=$(node -p "require('./apps/desktop/package.json').version")
                  echo "version=$version" >> "$GITHUB_OUTPUT"
                  echo "building version $version"

            - name: Build the web app
              shell: bash
              working-directory: apps/web
              run: pnpm build

            - name: Pack the web app into webapp.asar
              shell: bash
              working-directory: apps/desktop
              run: |
                  pnpm exec asar p ../web/webapp webapp.asar
                  ls -la webapp.asar

            - name: Build the desktop app
              shell: bash
              working-directory: apps/desktop
              run: |
                  # Extracting electron can fail with EPERM on Windows when a scanner
                  # still holds the freshly written files. It succeeds on a retry.
                  for attempt in 1 2 3; do
                    if pnpm run build --publish never; then
                      echo "built on attempt $attempt"
                      exit 0
                    fi
                    echo "attempt $attempt failed, retrying in 15s"
                    rm -rf dist
                    sleep 15
                  done
                  echo "electron-builder failed three times"
                  exit 1

            - name: List what was produced
              shell: bash
              working-directory: apps/desktop
              run: find dist -maxdepth 2 -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.deb' -o -name '*.pkg.tar.*' -o -name '*.pacman' -o -name '*.tar.gz' \) -exec ls -lh {} \;

            # electron-builder happily builds a package under a name that matches none
            # of the upload globs, and nothing complains: the build is green and the
            # artifact is simply missing a file. Fail here instead.
            - name: Check every expected Linux package exists
              if: runner.os == 'Linux'
              shell: bash
              working-directory: apps/desktop
              run: |
                  for pattern in 'dist/*.deb' 'dist/*.tar.gz' 'dist/*.pkg.tar.*'; do
                    # shellcheck disable=SC2086
                    if ! compgen -G "$pattern" > /dev/null; then
                      echo "::error::nothing matched $pattern - it was not built, or it was built under a name the upload step does not collect"
                      ls -la dist
                      exit 1
                    fi
                  done
                  echo "all three Linux packages present"

            - uses: actions/upload-artifact@v4
              with:
                  name: eledrone-${{ matrix.platform }}-${{ steps.version.outputs.version }}
                  retention-days: 14
                  if-no-files-found: error
                  # The Squirrel installer is still built, just not shipped: it is
                  # another ~181MB of the same app beside the 143MB MSI, and an
                  # artifact downloads as one zip, so you pay for both to get either.
                  # To ship it again, restore this line to the list below and the
                  # matching row in the release notes table further down:
                  #     apps/desktop/dist/squirrel-windows/*.exe
                  path: |
                      apps/desktop/dist/*.msi
                      apps/desktop/dist/*.deb
                      apps/desktop/dist/*.pkg.tar.*
                      apps/desktop/dist/*.pacman
                      apps/desktop/dist/*.tar.gz

    release:
        needs: build
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Version, and has it been released already?
              id: version
              run: |
                  version=$(node -p "require('./apps/desktop/package.json').version")
                  echo "version=$version" >> "$GITHUB_OUTPUT"
                  if git ls-remote --exit-code --tags origin "refs/tags/eledrone-v$version" >/dev/null 2>&1; then
                    echo "exists=true" >> "$GITHUB_OUTPUT"
                    echo "::warning::eledrone-v$version is already released - bump the version in apps/desktop/package.json before merging to main"
                  else
                    echo "exists=false" >> "$GITHUB_OUTPUT"
                    echo "will release eledrone-v$version"
                  fi

            - uses: actions/download-artifact@v4
              if: steps.version.outputs.exists == 'false'
              with:
                  path: artifacts
                  merge-multiple: true

            - if: steps.version.outputs.exists == 'false'
              run: ls -lhR artifacts

            - uses: softprops/action-gh-release@v2
              if: steps.version.outputs.exists == 'false'
              with:
                  tag_name: eledrone-v${{ steps.version.outputs.version }}
                  target_commitish: ${{ github.sha }}
                  name: eledrone v${{ steps.version.outputs.version }}
                  generate_release_notes: true
                  fail_on_unmatched_files: true
                  # Row removed alongside the Squirrel installer in the upload step
                  # above. Restore both together, or the notes advertise a file that
                  # is not attached:
                  #     | Windows installer (per user, no admin) | `Eledrone Setup *.exe` |
                  body: |
                      Desktop builds of eledrone for Windows and Linux.

                      | Platform | File |
                      |---|---|
                      | Windows installer (per machine) | `Eledrone *.msi` |
                      | Linux (Debian/Ubuntu) | `*.deb` |
                      | Linux (Arch) | `*.pkg.tar.*`, install with `pacman -U` |
                      | Linux (portable, any distro) | `*.tar.gz` |

                      These builds are **unsigned**, so Windows SmartScreen will warn on
                      first run, and local event search is unavailable because the native
                      search module is not built.
                  files: artifacts/**/*
